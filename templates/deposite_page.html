<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Main Screen</title>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                background: linear-gradient(135deg, #2e2e4e, #121212);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #ffffff;
            }

            /* Perfect Centering */
            .container {
                width: 100%;
                height: 100vh;
                display: flex;
                flex-direction: column; /* Stack form and message vertically */
                justify-content: center;
                align-items: center;
                box-sizing: border-box;
            }

            form {
                background: rgba(255, 255, 255, 0.05);
                backdrop-filter: blur(10px);
                padding: 40px;
                border-radius: 15px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            }

            h2 {
                text-align: center;
                color: #00d2ff;
                margin-top: 0;
                letter-spacing: 1.5px;
                text-transform: uppercase;
            }

            table {
                border-spacing: 0 15px;
            }

            label {
                font-size: 20px;
                color: #bbb;
                padding-right: 20px;
            }

            input {
                width: 100%;
                padding: 10px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 5px;
                color: white;
                outline: none;
                transition: border-color 0.3s;
            }

            input:focus {
                border-color: #00d2ff;
            }

            button {
                width: 100%;
                margin-top: 10px;
                padding: 12px;
                background: #28a745;
                border: none;
                border-radius: 6px;
                color: white;
                font-weight: bold;
                cursor: pointer;
                transition: transform 0.2s, background 0.3s;
            }

            button:hover {
                background: #218838;
                transform: translateY(-2px);
            }

            /* Message styling for after the deposit is made */
            .user-details {
                margin-top: 20px;
                padding: 15px;
                background: rgba(0, 210, 255, 0.1);
                border-radius: 8px;
                font-size: 16px;
                border: 1px solid #00d2ff;
            }
            @media (max-width: 500px) {
                .container{
                    width: 94%;
                    margin-left: 3%;
                    margin-right: 3%;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <form action="/deposite" method="POST">
                <table class="table">
                    <tr><td colspan="2"><h2>DEPOSITE MONEY</h2></td></tr>
                    <tr>
                        <td><label>Enter Email</label></td>
                        <td><input type="email" name="email" placeholder="Email" required></td>
                    </tr>
                    <tr>
                        <td><label>Enter Password</label></td>
                        <td><input type="password" name="password" placeholder="Password" required></td>
                    </tr>
                    <tr>
                        <td><label>Enter Amount to Deposite</label></td>
                        <td><input type="text" name="amount" placeholder="Amount" required></td>
                    </tr>
                    <tr>
                        <td colspan="2"><button type="submit">SUBMIT</button></td>
                    </tr>
                </table>
            </form>
        {%if message%}
            <h2 class="user-details"><label>{{username}}, {{user_id}}, {{email}}</label></h2>
        {% endif %}
        {% if show_error %}
            <h2 class="user-details">{{error}}</h2>                
        {% endif %}
        
        </div>
    </body>
</html>
