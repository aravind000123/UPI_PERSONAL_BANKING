<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* --- GLOBAL --- */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* --- BACKGROUND --- */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(270deg, #3672a7, #4facfe, #00c6ff, #3672a7);
            background-size: 400% 400%;
            animation: bgMove 12s ease infinite;
        }

        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- CARD --- */
        table {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);

            color: white;
            padding: 30px;
            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.3);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.3),
                inset 0 0 10px rgba(255,255,255,0.2);

            font-size: 130%;
            border-collapse: separate;
            border-spacing: 0 15px;
            /* min-width: 320px; */

            transition: 0.3s;
        }

        table:hover {
            transform: translateY(-5px);
        }

        td {
            padding: 5px 10px;
        }

        /* --- INPUT --- */
        input {
            width: 100%;
            padding: 10px;

            border-radius: 6px;
            border: none;

            outline: none;

            background: rgba(255,255,255,0.2);
            color: white;

            transition: 0.3s;
        }

        input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        input:focus {
            background: rgba(255,255,255,0.3);
            box-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        /* --- BUTTON --- */
        .button {
            text-align: center;
        }

        button {
            width: 100%;
            padding: 10px;

            border-radius: 6px;
            border: none;

            background: linear-gradient(90deg, #00c853, #64dd17);
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;

            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        button:active {
            transform: scale(0.97);
        }

        /* --- MOBILE --- */
        @media (max-width: 500px) {
            table {
                width: 94%;
                font-size: 120%;
                margin-left: 3%;
                margin-right: 3%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <form method="POST" action="/login">
            <table>
                <tr>
                    <td>Email</td>
                    <td><input id="email" type="email" name="email" placeholder="Enter email" required></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td><input id="password" type="password" name="password" placeholder="Enter Password" required></td>
                </tr>
                <tr>
                    <td class="button" colspan="2">
                        <button type="submit">SUBMIT</button>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center; font-size: 0.9em; color: #504f4f;">
                        Don't have an account? <a href="/" style="color: #0033ff; text-decoration: none;">Sign Up</a>
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
